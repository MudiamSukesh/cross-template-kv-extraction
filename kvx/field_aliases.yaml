# Printed-key vocabulary per gold field, used ONLY for the kv_field_recall metric:
# a found value counts as correctly keyed when the key the model linked it to contains one of these
# phrases (case and punctuation ignored, whole-word match). Edit freely; the list is part of the
# evaluation protocol, so report it with the results. Fields without aliases are excluded from
# kv_field_recall (their values still count for value_recall).

